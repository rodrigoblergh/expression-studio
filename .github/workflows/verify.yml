name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/check.cjs
      - run: node --test
      - if: runner.os == 'macOS'
        run: bash -n scripts/update-macos.sh && bash scripts/test-update-macos.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/Test-Update.ps1
          ./scripts/Test-Signatures.ps1
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/accessibility.test.cjs
        env:
          A11Y_BROWSER_CHANNEL: chromium
  package:
    needs: [test, browser]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expression-studio-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
